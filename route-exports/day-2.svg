<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1238" viewBox="0 0 760 1238"><rect width="760" height="1238" fill="#f4efe5"/><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#283d35}.small{font-size:14px;fill:#667169}.title{font-size:24px}.time{font-size:17px;fill:#a3422d}</style><text x="40" y="45" class="small">SEOUL, WITH YOU / 2026.12.06</text><text x="40" y="88" style="font-size:30px">DAY 2 · 每日动线顺序图</text><text x="40" y="120" class="small">按编号走 · 示意图不按地理比例 · 具体路线请打开网页里的Naver导航</text><circle cx="65" cy="175" r="22" fill="#a3422d"/><text x="65" y="181" text-anchor="middle" style="fill:#fff;font-size:18px">1</text><text x="105" y="166" class="time">08:00出发</text><text x="105" y="198" class="title">长安洞住宿范围</text><path d="M65 229 V278" stroke="#aab3a4" stroke-width="2"/><text x="100" y="267" class="small">↓ 接驳5号线往傍花 → 青丘 청구换6号线往上水 상수，1号口后按贝果地址走。含接</text><circle cx="65" cy="301" r="22" fill="#a3422d"/><text x="65" y="307" text-anchor="middle" style="fill:#fff;font-size:18px">2</text><text x="105" y="292" class="time">09:30–10:00</text><text x="105" y="324" class="title">善旴贝果 · 少量外带</text><path d="M65 355 V404" stroke="#aab3a4" stroke-width="2"/><text x="100" y="393" class="small">↓ 短程合乘预算30分钟，费用另计；若选公交需当日查车号、增加缓冲，优先保证市场与下</text><circle cx="65" cy="427" r="22" fill="#a3422d"/><text x="65" y="433" text-anchor="middle" style="fill:#fff;font-size:18px">3</text><text x="105" y="418" class="time">10:30–11:15</text><text x="105" y="450" class="title">延禧奶油水果三明治</text><path d="M65 481 V530" stroke="#aab3a4" stroke-width="2"/><text x="100" y="519" class="small">↓ 向西南短程合乘，预算20–30分钟；省钱公交路线当日查，不编未核实车号。</text><circle cx="65" cy="553" r="22" fill="#a3422d"/><text x="65" y="559" text-anchor="middle" style="fill:#fff;font-size:18px">4</text><text x="105" y="544" class="time">11:45–13:15</text><text x="105" y="576" class="title">望远传统市场 · 90分钟</text><path d="M65 607 V656" stroke="#aab3a4" stroke-width="2"/><text x="100" y="645" class="small">↓ 望远6号线往孔德 → 孔德换5号线往汝矣岛 → 汝矣岛3号口地下连接百货，或4号</text><circle cx="65" cy="679" r="22" fill="#a3422d"/><text x="65" y="685" text-anchor="middle" style="fill:#fff;font-size:18px">5</text><text x="105" y="670" class="time">14:15–17:00</text><text x="105" y="702" class="title">现代百货 · 2小时45分钟</text><path d="M65 733 V782" stroke="#aab3a4" stroke-width="2"/><text x="100" y="771" class="small">↓ 按当天人行路线向汉江走，预算20分钟，使用过街设施；不为拍江景穿车道。</text><circle cx="65" cy="805" r="22" fill="#a3422d"/><text x="65" y="811" text-anchor="middle" style="fill:#fff;font-size:18px">6</text><text x="105" y="796" class="time">17:20–18:00</text><text x="105" y="828" class="title">汉江＋便利店 · 40分钟</text><path d="M65 859 V908" stroke="#aab3a4" stroke-width="2"/><text x="100" y="897" class="small">↓ 汝矣渡口 여의나루5号线往市区 → 钟路三街 종로3가，出站沿当日导航到청계천로</text><circle cx="65" cy="931" r="22" fill="#a3422d"/><text x="65" y="937" text-anchor="middle" style="fill:#fff;font-size:18px">7</text><text x="105" y="922" class="time">19:00–19:50</text><text x="105" y="954" class="title">Red Velvet · 瑟琪线索 Angle340</text><path d="M65 985 V1034" stroke="#aab3a4" stroke-width="2"/><text x="100" y="1023" class="small">↓ 从最后一站直接返回，先核对全程末班与住宿接驳</text><circle cx="65" cy="1057" r="22" fill="#a3422d"/><text x="65" y="1063" text-anchor="middle" style="fill:#fff;font-size:18px">8</text><text x="105" y="1048" class="time">21:15左右</text><text x="105" y="1080" class="title">长安洞住宿范围</text><text x="40" y="1188" class="small">住宿仅为用户截图范围估计；此图可保存，离线对照顺序使用。</text></svg>